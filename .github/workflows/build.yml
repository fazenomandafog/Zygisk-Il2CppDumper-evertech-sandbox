name: Build Zygisk-Il2CppDumper

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Target package name'
        required: true
        default: 'com.evertechsandbox'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Modify target package
        run: |
          sed -i 's/com.example.game/${{ github.event.inputs.package_name }}/g' module/src/main/cpp/game.h

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :module:assembleRelease

      - name: Find ZIP file
        run: |
          find . -name "*.zip" -type f

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper-${{ github.event.inputs.package_name }}
          path: |
            module/release/*.zip
            module/build/outputs/apk/release/*.zip
            **/*.zip
